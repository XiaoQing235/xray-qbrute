[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/wasm"]
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
sha2 = "0.11.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
rayon = "1.12.0"
wgpu = { version = "30.0.0", default-features = false }
pollster = "1.0.1"
clap = { version = "4.6.4", features = ["derive"] }
indicatif = "0.18.6"
hex = "0.4.3"
criterion = "0.8.2"
wasm-bindgen = "=0.2.126"
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.103"
web-sys = { version = "0.3.103", default-features = false }
wasm-bindgen-futures = "0.4.76"
futures-channel = "0.3.33"
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
